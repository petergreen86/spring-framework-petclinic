# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:
- task: Maven@3
  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.8'
    jdkArchitectureOption: 'x64'
    goals: 'package'

# - task: Bash@3
#   displayName: 'Run Synopsys Detect'
#   inputs:
#     targetType: 'inline'
#     script: |
#       docker run \
#       --rm \
#       -v $(Build.SourcesDirectory):/source \
#       -v $(Agent.TempDirectory):/output \
#       blackducksoftware/detect:7 \
#       --blackduck.trust.cert=true \
#       --blackduck.url=https://20.90.219.73 \
#       --blackduck.api.token=$(BLACKDUCK_API_TOKEN)

- task: SynopsysDetectTask@7
  inputs:
    BlackDuckService: 'gcp'
    DetectArguments: '--detect.project.name=pgreen-springframework --detect.project.version.name=master --blackduck.trust.cert=true'
    DetectVersion: 'latest'

- task: PublishTestResults@2
  displayName: 'Publish Test Results **/*.xml'
  inputs:
    testResultsFiles: '**/*.xml'

